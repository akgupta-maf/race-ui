trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - package.json

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

stages:
  - stage: Build
    displayName: 'Build & Type-check'
    jobs:
      - job: Build
        displayName: 'Compile library'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Set up Node.js $(nodeVersion)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run typecheck
            displayName: 'Type check'

          - script: npm run build
            displayName: 'Build library'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: dist
              artifact: 'dist'
            displayName: 'Upload dist artifact'

  - stage: Publish
    displayName: 'Publish to Azure Artifacts'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Publish
        displayName: 'npm publish'
        # Creates an approval gate in Azure DevOps Environments — optional, remove if not needed
        environment: 'race-ui-npm'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: NodeTool@0
                  inputs:
                    versionSpec: $(nodeVersion)
                  displayName: 'Set up Node.js $(nodeVersion)'

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: 'dist'
                    path: $(System.DefaultWorkingDirectory)/dist
                  displayName: 'Download dist artifact'

                # Injects auth token into .npmrc for the Azure Artifacts feed.
                # Requires a service connection of type "npm" pointing to your feed.
                - task: npmAuthenticate@0
                  inputs:
                    workingFile: .npmrc
                  displayName: 'Authenticate with Azure Artifacts'

                - script: |
                    CURRENT=$(node -p "require('./package.json').version")
                    PUBLISHED=$(npm view $(node -p "require('./package.json').name") version 2>/dev/null || echo "0.0.0")
                    echo "Current: $CURRENT | Published: $PUBLISHED"
                    if [ "$CURRENT" = "$PUBLISHED" ]; then
                      echo "##[warning]Version $CURRENT is already published."
                      echo "Run 'npm version patch|minor|major' locally and push to publish a new version."
                    else
                      npm publish
                      echo "Published @yourcompany/race-ui@$CURRENT to Azure Artifacts."
                    fi
                  displayName: 'Publish (only if version bumped)'
